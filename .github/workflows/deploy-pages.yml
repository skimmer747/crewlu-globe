name: Deploy to GitHub Pages

# Reliable replacement for the flaky legacy gh-pages branch build.
# Builds the Vite site in CI and publishes it to Pages (custom domain globe.crewlu.net
# is held in the Pages config + dist/CNAME). Deploys on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only by default. Only the deploy job, which runs no project code, may publish to Pages.
permissions:
  contents: read

# Never cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Named rather than ubuntu-latest, so a new Ubuntu arrives on purpose, in a deploy someone watches.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # Keeps .well-known/apple-app-site-association, the file iPhones read to link the app with the site.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    # This repo's Pages backend chronically returns "Deployment failed, try again later" on the
    # first attempt but succeeds on a retry — so try up to 3 times before failing the run.
    steps:
      - id: a1
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - id: a2
        if: steps.a1.outcome != 'success'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - id: a3
        if: steps.a1.outcome != 'success' && steps.a2.outcome != 'success'
        uses: actions/deploy-pages@v5
